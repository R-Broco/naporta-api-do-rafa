name: SRE Traffic Generator

on:
  schedule:
    # Dispara o runner a cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite disparos manuais no painel do GitHub Actions

jobs:
  run-simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Executar Simulação
        env:
          API_URL: 'https://naporta-api-do-rafa.onrender.com'
        run: node simulate-traffic.js
